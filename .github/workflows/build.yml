name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller customtkinter
    
    - name: Build executable (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "MirageGeo-CBC-Windows" --add-data "calculator.py;." gui.py
    
    - name: Build executable (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "MirageGeo-CBC-macOS" --add-data "calculator.py:." gui.py
    
    - name: Build executable (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "MirageGeo-CBC-Linux" --add-data "calculator.py:." gui.py
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: mirage-geo-${{ matrix.os }}
        path: dist/
        retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          artifacts/mirage-geo-windows-latest/*
          artifacts/mirage-geo-macos-latest/*
          artifacts/mirage-geo-ubuntu-latest/*
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}